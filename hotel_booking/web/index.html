<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel booking</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1d2433; --muted: #6b7280; --line: #e5e1d8;
    --accent: #1f5f5b; --accent-ink: #ffffff; --ok: #1f7a4d; --ok-bg: #e7f4ec;
    --warn: #9a5b00; --warn-bg: #fdf1dc; --err: #a12a2a; --err-bg: #fbe9e9;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1c2027; --ink: #e8e6e1; --muted: #9aa0aa; --line: #2c313a;
      --accent: #5fb3ab; --accent-ink: #0d1412; --ok: #6fcf9a; --ok-bg: #16281f;
      --warn: #e5b45c; --warn-bg: #2b2213; --err: #ef8a8a; --err-bg: #2d1818;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--ink); }
  header { padding: 32px 24px 8px; max-width: 980px; margin: 0 auto; }
  header h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 980px; margin: 0 auto; padding: 16px 24px 48px; display: grid; gap: 20px;
         grid-template-columns: 1fr 300px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  .card h2 { margin: 0 0 14px; font-size: 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
          border-radius: 8px; padding: 9px 11px; min-width: 0; }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 8px;
           padding: 10px 16px; background: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .55; cursor: progress; }
  .rooms { display: grid; gap: 12px; margin-top: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .room { border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
  .room-head { display: flex; justify-content: space-between; align-items: baseline; }
  .room-num { font-size: 22px; font-weight: 700; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); color: var(--muted);
         border: 1px solid var(--line); }
  .room form { display: grid; gap: 8px; }
  .empty { color: var(--muted); padding: 18px 0 4px; }
  .msg { margin-top: 14px; padding: 10px 12px; border-radius: 8px; font-size: 14px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.err { background: var(--err-bg); color: var(--err); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--bg); border-radius: 8px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .side { display: grid; gap: 20px; align-content: start; }
  .hint { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
  code { font-size: 12px; background: var(--bg); padding: 1px 5px; border-radius: 4px; }
  ul.mine { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  ul.mine li { display: flex; justify-content: space-between; align-items: center; font-size: 14px;
               border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  ul.mine li.cancelled { color: var(--muted); text-decoration: line-through; }
  ul.mine button { padding: 4px 10px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>Hotel booking</h1>
  <p>Find a free room, book it, cancel it. Every action calls the same HTTP API as the tests.</p>
</header>

<main>
  <section class="card">
    <h2>Free rooms</h2>
    <form id="search" class="row">
      <label>Check-in <input type="date" id="checkIn" required></label>
      <label>Check-out <input type="date" id="checkOut" required></label>
      <button type="submit">Search</button>
    </form>
    <div id="searchMsg" class="msg"></div>
    <div id="rooms" class="rooms"></div>
  </section>

  <aside class="side">
    <section class="card">
      <h2>Since the app started</h2>
      <div class="stats">
        <div class="stat"><b id="sQ">–</b><span>DB queries</span></div>
        <div class="stat"><b id="sH">–</b><span>Cache hits</span></div>
        <div class="stat"><b id="sM">–</b><span>Cache misses</span></div>
      </div>
      <p class="hint">From <code>GET /stats</code>. Search the same dates twice: the second time is a cache hit.</p>
    </section>

    <section class="card">
      <h2>Bookings from this page</h2>
      <ul id="mine" class="mine"><li style="border:0;padding:0;color:var(--muted)">None yet.</li></ul>
      <form id="cancelForm" class="row" style="margin-top:12px">
        <label style="flex:1">Cancel by id <input id="cancelId" placeholder="R101" required></label>
        <button class="ghost" type="submit">Cancel</button>
      </form>
      <div id="cancelMsg" class="msg"></div>
    </section>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const mine = [];

function show(el, kind, text) { el.className = "msg show " + kind; el.textContent = text; }
function hide(el) { el.className = "msg"; }
function problemText(body, fallback) { return body && body.detail ? body.detail : fallback; }

async function api(method, url, body) {
  const res = await fetch(url, {
    method, headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  if (res.status !== 204) { try { data = await res.json(); } catch { data = null; } }
  return { status: res.status, data };
}

async function refreshStats() {
  try {
    const { data } = await api("GET", "/stats");
    $("sQ").textContent = data.dbQueries; $("sH").textContent = data.cacheHits; $("sM").textContent = data.cacheMisses;
  } catch { /* stats are a nice-to-have */ }
}

function renderMine() {
  const list = $("mine");
  if (!mine.length) return;
  list.innerHTML = "";
  for (const b of mine) {
    const li = document.createElement("li");
    if (b.cancelled) li.className = "cancelled";
    const text = document.createElement("span");
    text.textContent = `${b.id} · ${b.room} · ${b.checkIn} → ${b.checkOut}`;
    li.appendChild(text);
    if (!b.cancelled) {
      const btn = document.createElement("button");
      btn.className = "ghost"; btn.textContent = "Cancel";
      btn.onclick = () => cancel(b.id);
      li.appendChild(btn);
    }
    list.appendChild(li);
  }
}

function roomCard(room, checkIn, checkOut) {
  const card = document.createElement("div");
  card.className = "room";
  card.innerHTML = `
    <div class="room-head"><span class="room-num"></span><span class="tag"></span></div>
    <form>
      <input name="guestName" placeholder="Guest name" required>
      <input name="guestEmail" type="email" placeholder="guest@example.com" required>
      <button type="submit">Book</button>
    </form>
    <div class="msg"></div>`;
  card.querySelector(".room-num").textContent = room.number;
  card.querySelector(".tag").textContent = room.type;
  const form = card.querySelector("form"), msg = card.querySelector(".msg"), btn = form.querySelector("button");
  form.onsubmit = async (e) => {
    e.preventDefault();
    btn.disabled = true; hide(msg);
    const body = { guestName: form.guestName.value.trim(), guestEmail: form.guestEmail.value.trim(),
                   room: room.number, checkIn, checkOut };
    try {
      const { status, data } = await api("POST", "/reservations", body);
      if (status === 201) {
        mine.unshift({ id: data.id, room: room.number, checkIn, checkOut, cancelled: false });
        renderMine();
        show(msg, "ok", `Booked: ${data.id}` + (data.notificationFailed ? " (confirmation message failed)" : ""));
        form.reset();
        setTimeout(search, 1200);
      } else if (status === 409) {
        show(msg, "warn", "Someone else just took this room for at least one of these nights.");
      } else {
        show(msg, "err", problemText(data, `Error ${status}`));
      }
    } catch { show(msg, "err", "The server did not answer."); }
    btn.disabled = false; refreshStats();
  };
  return card;
}

async function search(e) {
  if (e) e.preventDefault();
  const checkIn = $("checkIn").value, checkOut = $("checkOut").value, box = $("rooms"), msg = $("searchMsg");
  hide(msg); box.innerHTML = "";
  try {
    const { status, data } = await api("GET", `/rooms/availability?checkIn=${checkIn}&checkOut=${checkOut}&limit=100`);
    if (status !== 200) { show(msg, "err", problemText(data, `Error ${status}`)); return; }
    if (!data.rooms.length) { box.innerHTML = '<div class="empty">No free rooms for these nights.</div>'; }
    for (const room of data.rooms) box.appendChild(roomCard(room, checkIn, checkOut));
  } catch { show(msg, "err", "The server did not answer. Is python main.py running?"); }
  refreshStats();
}

async function cancel(id) {
  const msg = $("cancelMsg");
  hide(msg);
  try {
    const { status, data } = await api("DELETE", `/reservations/${encodeURIComponent(id)}`);
    if (status === 204) {
      show(msg, "ok", `${id} cancelled. The nights are free again.`);
      const b = mine.find((x) => x.id === id); if (b) { b.cancelled = true; renderMine(); }
      search();
    } else {
      show(msg, "err", problemText(data, `Error ${status}`));
    }
  } catch { show(msg, "err", "The server did not answer."); }
  refreshStats();
}

$("search").onsubmit = search;
$("cancelForm").onsubmit = (e) => { e.preventDefault(); cancel($("cancelId").value.trim()); };
$("checkIn").value = "2026-11-12"; $("checkOut").value = "2026-11-14";
search();
</script>
</body>
</html>
